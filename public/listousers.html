<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1> Registro de usuarios</h1>
  <form id="formularioUsuario">
    <input type="text" id="nombre" placeholder="Nombre" required />
    <input type="password" id="password" placeholder="Contraseña" required />
    <input type="number" id="document" placeholder="Documento" required />
    <input type="text" id="city" placeholder="Ciudad de residencia" required />
    <input type="number" id="age" placeholder="edad" required />
    <input type="text" id="gender" placeholder="genero" required />
    


    <button type="submit">Agregar</button>
  </form>

  <ul id="listaUsuarios"></ul>

  <script src="script.js"></script>
</body>
</html>
